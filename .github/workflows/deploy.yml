name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is already running.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Pinned deliberately. Zola 0.23 removed shortcodes and moved to Tera 2;
  # Duckquill uses shortcodes and is in reduced maintenance mode, so it does
  # not build on 0.23. See README.md before bumping this.
  ZOLA_VERSION: "0.22.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The theme lives in themes/duckquill as a submodule.
          submodules: recursive

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Zola
        run: |
          curl -sSL -o zola.tar.gz \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf zola.tar.gz
          sudo mv zola /usr/local/bin/
          zola --version

      - name: Build
        # The Pages URL is only known at run time, so it overrides config.toml.
        run: zola build --base-url "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
