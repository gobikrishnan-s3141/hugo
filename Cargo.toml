[package]
name = "quill"
version = "0.1.0"
edition = "2021"
description = "A tiny static site generator: markdown in, HTML out."

[[bin]]
name = "quill"
path = "src/main.rs"

[dependencies]
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
toml = "0.8"
serde_json = "1"
tera = "1"
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

[profile.release]
opt-level = 2
strip = true
